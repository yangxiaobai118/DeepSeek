name: release uniproxy

on:
  push:
    branches: [feature/uniproxy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uniproxy-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniproxy
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the test suite
        run: node --test test/*.test.js

      - name: Validate the installer script
        run: |
          sh -n install.sh
          UNIPROXY_DRY_RUN=1 UNIPROXY_VERSION="$(node -p "require('./package.json').version")" sh install.sh

      - name: Resolve package version and tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=uniproxy-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the platform bundles
        run: node scripts/package.mjs --out dist

      - name: Verify the bundles on a Linux filesystem
        run: |
          tar -xzf dist/uniproxy-*-linux-x86_64.tar.gz -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/uniproxy/uniproxy"
          grep -q 'linux-x86_64' "$RUNNER_TEMP/uniproxy/ENVIRONMENT.txt"
          head -n 1 "$RUNNER_TEMP/uniproxy/uniproxy" | grep -qx '#!/bin/sh'
          node "$RUNNER_TEMP/uniproxy/src/index.js" --help >/dev/null
          work=$(mktemp -d)
          node "$RUNNER_TEMP/uniproxy/src/index.js" init -c "$work/config.json" >/dev/null
          node "$RUNNER_TEMP/uniproxy/src/index.js" validate -c "$work/config.json"
          grep -q 'linux-x86_64' dist/PLATFORMS.md
          unzip -l dist/uniproxy-*-windows-x86_64.zip | grep -q 'uniproxy/uniproxy.cmd'

      - name: Build the npm tarball and checksums
        run: |
          npm pack --pack-destination dist
          cd dist
          for file in uniproxy-*.tgz; do
            sha256sum "$file" > "$file.sha256"
            sha256sum "$file" >> SHA256SUMS.txt
          done
          ls -1 | sort

      - name: Extract release notes
        run: |
          awk 'BEGIN { n = 0 } /^## / { n++ } n <= 1 { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "uniproxy $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* \
              --title "uniproxy $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --target "$GITHUB_SHA"
          fi

      - name: Remove stale archive assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          keep=$(ls dist | tr '\n' ' ')
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case "$name" in
              *.tar.gz|*.tar.gz.sha256|*.zip|*.zip.sha256|*.tgz|*.tgz.sha256|PLATFORMS.md|SHA256SUMS.txt)
                case " $keep " in
                  *" $name "*) echo "keep $name" ;;
                  *) echo "delete $name"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null ;;
                esac ;;
              *) echo "keep $name" ;;
            esac
          done

  binaries:
    name: standalone binaries (${{ matrix.runner }})
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: linux-x64,linux-arm64,linux-ppc64le,linux-s390x,linux-musl-x64,win-x64,win-arm64
          - runner: macos-latest
            targets: darwin-x64,darwin-arm64
    defaults:
      run:
        working-directory: uniproxy
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js (must match the downloaded runtimes)
        uses: actions/setup-node@v4
        with:
          node-version: 24.21.0

      - name: Install bundler and injector
        run: npm install --no-save --no-package-lock esbuild postject

      - name: Build standalone binaries
        run: node scripts/build-sea.mjs --out bin --targets "${{ matrix.targets }}"

      - name: Smoke-test the Linux binary without Node
        if: runner.os == 'Linux'
        run: |
          BIN=$(ls bin/uniproxy-*-linux-x64)
          env -i "$BIN" --help >/dev/null
          work=$(mktemp -d)
          env -i "$BIN" init -c "$work/config.json" >/dev/null
          env -i "$BIN" validate -c "$work/config.json"
          file "$BIN"

      - name: Smoke-test the macOS binary
        if: runner.os == 'macOS'
        run: |
          BIN=$(ls bin/uniproxy-*-darwin-arm64)
          "$BIN" --help >/dev/null
          work=$(mktemp -d)
          "$BIN" init -c "$work/config.json" >/dev/null
          "$BIN" validate -c "$work/config.json"
          codesign --verify --verbose "$BIN"

      - name: Upload binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release upload "uniproxy-v$VERSION" bin/* --clobber

  docs:
    name: manuals
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python-docx
        run: pip install python-docx

      - name: Build the manuals (DOCX)
        run: |
          mkdir -p docs-out
          VERSION=$(node -p "require('./uniproxy/package.json').version")
          python uniproxy/scripts/md2docx.py uniproxy/docs/INSTALL.zh-CN.md "docs-out/uniproxy-$VERSION-manual-zh.docx" "$VERSION" "安装与部署手册" "按实际操作顺序编写：每一步包含目的、操作、预期结果与排查方式" "目录"
          python uniproxy/scripts/md2docx.py uniproxy/docs/INSTALL.md "docs-out/uniproxy-$VERSION-manual-en.docx" "$VERSION" "Installation & Deployment Manual" "Step-by-step: goal, commands, expected result and troubleshooting" "Contents"

      - name: Convert the manuals to PDF
        run: |
          if ! command -v soffice >/dev/null 2>&1; then
            sudo apt-get update || true
            sudo apt-get install -y --no-install-recommends libreoffice-writer || true
          fi
          if command -v fc-list >/dev/null 2>&1 && ! fc-list :lang=zh | grep -q .; then
            sudo apt-get install -y fonts-noto-cjk || true
          fi
          if command -v soffice >/dev/null 2>&1; then
            (cd docs-out && soffice --headless --convert-to pdf *.docx) || echo "PDF conversion failed; DOCX will still be uploaded"
          else
            echo "LibreOffice is unavailable; uploading DOCX only"
          fi
          ls -lh docs-out

      - name: Upload the manuals to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./uniproxy/package.json').version")
          gh release upload "uniproxy-v$VERSION" docs-out/* --clobber
