name: release uniproxy

on:
  push:
    branches: [feature/uniproxy]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: uniproxy-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: uniproxy
    steps:
      - name: Check out the branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run the test suite
        run: node --test test/*.test.js

      - name: Resolve package version and tag
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=uniproxy-v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build the portable packages
        run: node scripts/package.mjs --out dist

      - name: Verify the bundle on a Linux filesystem
        run: |
          tar -xzf dist/uniproxy-*.tar.gz -C "$RUNNER_TEMP"
          test -x "$RUNNER_TEMP/uniproxy/uniproxy"
          head -n 1 "$RUNNER_TEMP/uniproxy/uniproxy" | grep -qx '#!/bin/sh'
          if grep -q $'\r' "$RUNNER_TEMP/uniproxy/uniproxy"; then
            echo "launcher has CRLF line endings" >&2
            exit 1
          fi
          node "$RUNNER_TEMP/uniproxy/src/index.js" --help >/dev/null
          work=$(mktemp -d)
          node "$RUNNER_TEMP/uniproxy/src/index.js" init -c "$work/config.json" >/dev/null
          node "$RUNNER_TEMP/uniproxy/src/index.js" validate -c "$work/config.json"
          unzip -l dist/uniproxy-*.zip | grep -q 'uniproxy/uniproxy.cmd'

      - name: Build the npm tarball and checksums
        run: |
          npm pack --pack-destination dist
          cd dist
          for file in uniproxy-*.tgz; do
            sha256sum "$file" > "$file.sha256"
            sha256sum "$file" >> SHA256SUMS.txt
          done
          ls -1 | sort

      - name: Extract release notes
        run: |
          awk 'BEGIN { n = 0 } /^## / { n++ } n <= 1 { print }' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
            gh release edit "$TAG" --title "uniproxy $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" dist/* \
              --title "uniproxy $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --target "$GITHUB_SHA"
          fi

      - name: Remove stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
        run: |
          RELEASE_ID=$(gh release view "$TAG" --json databaseId --jq '.databaseId')
          keep=$(ls dist | tr '\n' ' ')
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" --paginate \
            --jq '.[] | [.id, .name] | @tsv' |
          while IFS=$'\t' read -r id name; do
            case " $keep " in
              *" $name "*) echo "keep $name" ;;
              *) echo "delete $name"; gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/assets/$id" >/dev/null ;;
            esac
          done
