<!doctype html>
<html lang="zh"><head><meta charset="utf-8"><title>u-ui</title>
<style>
body{font-family:system-ui,Segoe UI,sans-serif;margin:0;background:#0f1115;color:#e6e6e6}
header{display:flex;align-items:center;gap:16px;padding:14px 22px;background:#171a21;border-bottom:1px solid #2a2f3a}
header h1{margin:0;font-size:16px}
nav{display:flex;gap:8px;flex:1;flex-wrap:wrap}
nav button{background:#0b0d12;border:1px solid #2a2f3a;color:#c9d1d9;padding:6px 12px;border-radius:6px;cursor:pointer}
nav button.on{background:#3b6cf6;border-color:#3b6cf6;color:#fff}
header a{color:#8b93a3;text-decoration:none;font-size:13px}
main{padding:22px;display:grid;gap:16px}
section{display:none}section.on{display:grid;gap:16px}
.card{background:#171a21;border:1px solid #2a2f3a;border-radius:8px;padding:16px}
.card h2{margin:0 0 12px;font-size:13px;color:#9fb3ff}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:6px 8px;border-bottom:1px solid #2a2f3a;text-align:left}
th{color:#8b93a3;font-weight:500}
code,pre{font-family:ui-monospace,Consolas,monospace;font-size:12px}
pre{background:#0b0d12;padding:12px;border-radius:6px;overflow:auto;max-height:340px;white-space:pre-wrap}
input,textarea,select{background:#0b0d12;border:1px solid #2a2f3a;color:#e6e6e6;border-radius:6px;padding:8px;font-size:13px;box-sizing:border-box}
textarea{width:100%;min-height:320px;font-family:ui-monospace,Consolas,monospace}
button.act{background:#3b6cf6;border:0;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px}
button.ghost{background:#0b0d12;border:1px solid #2a2f3a;color:#c9d1d9;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px}
button.danger{border-color:#7f1d1d;color:#ff6b6b}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row label{display:grid;gap:4px;font-size:12px;color:#8b93a3}
.err{color:#ff6b6b}.warn{color:#ffd166}.ok{color:#3ddc84}
.muted{color:#8b93a3;font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;border:1px solid #2a2f3a}
.pill.on{color:#3ddc84;border-color:#1f6f43}.pill.off{color:#ff6b6b;border-color:#7f1d1d}
</style></head><body>
<header><h1>u-ui</h1>
<nav>
<button data-tab="overview" class="on">概览</button>
<button data-tab="inbounds">入站</button>
<button data-tab="users">用户</button>
<button data-tab="cores">内核</button>
<button data-tab="stats">流量</button>
<button data-tab="logs">日志</button>
<button data-tab="config">配置</button>
<button data-tab="actions">操作</button>
<button data-tab="settings">设置</button>
</nav><a href="/logout">退出</a></header>
<main>
<section id="tab-overview" class="on">
  <div class="card"><h2>状态</h2><div id="overview"></div></div>
  <div class="card"><h2>端口</h2><div id="ports"></div></div>
</section>
<section id="tab-inbounds">
  <div class="card"><h2>入站（同时管理 xray 与 sing-box）</h2><div id="inboundTable"></div></div>
  <div class="card"><h2 id="inboundFormTitle">新增入站</h2><div id="inboundForm"></div></div>
  <div class="card"><h2 id="clientsTitle">客户端</h2><div id="clientsPanel"><div class="muted">在上表点「客户端」查看或添加</div></div></div>
</section>
<section id="tab-users">
  <div class="card"><h2>用户注册表</h2><div id="userTable"></div></div>
  <div class="card"><h2 id="userFormTitle">新增用户</h2><div id="userForm"></div></div>
</section>
<section id="tab-cores">
  <div class="card"><h2>内核与服务</h2><div id="coreTable"></div>
  <div class="muted" style="margin-top:10px">开关控制的是 uniproxy 是否生成该内核的配置；启动/停止/重启走 systemctl。</div></div>
</section>
<section id="tab-stats">
  <div class="card"><h2>流量（来自内核统计接口）</h2><div id="statsTable"></div>
  <div class="row" style="margin-top:10px"><button class="act" id="syncStats">同步到 users.usage</button><span id="statsMsg" class="muted"></span></div></div>
  <div class="card"><h2>采集错误</h2><div id="statsErrors" class="muted">(none)</div></div>
</section>
<section id="tab-logs">
  <div class="card"><h2>日志（journalctl）</h2>
  <div class="row"><label>来源<select id="logUnit"><option value="xray">xray</option><option value="singbox">sing-box</option><option value="nginx">nginx</option><option value="sub">uniproxy-sub</option></select></label>
  <label>行数<input id="logLines" type="number" value="200" min="10" max="1000"></label>
  <button class="ghost" id="loadLogsBtn">刷新</button></div>
  <pre id="logOut" style="margin-top:12px">(idle)</pre></div>
</section>
<section id="tab-config">
  <div class="card"><h2>config.json（保存前会跑 validate，并自动备份）</h2>
  <textarea id="configText"></textarea>
  <div class="row" style="margin-top:10px"><button class="act" id="saveConfig">保存配置</button>
  <button class="ghost" id="reloadConfig">重新载入</button><span id="configMsg" class="muted"></span></div></div>
</section>
<section id="tab-actions">
  <div class="card"><h2>操作</h2>
  <div class="row">
  <button class="ghost" data-action="validate">validate</button>
  <button class="ghost" data-action="doctor">doctor</button>
  <button class="ghost" data-action="plan">plan（只预览）</button>
  <label>输入 APPLY 确认 <input id="applyConfirm" size="10" placeholder="APPLY"></label>
  <button class="act" data-action="apply">apply</button>
  </div><pre id="actionOut" style="margin-top:12px">(idle)</pre></div>
</section>
<section id="tab-settings">
  <div class="card"><h2>设置（写入 config.json，保存前校验）</h2><div id="settingsForm"><div class="muted">载入中…</div></div></div>
</section>
</main>
<script>
const csrf = () => { const m = document.cookie.match(/(?:^|; )uui_csrf=([^;]+)/); return m ? m[1] : ''; };
let state = null; let cores = []; let editingUser = null; let editingInbound = null; let currentInbound = null;
async function api(method, path, body) {
  const opts = { method, headers: { 'x-uui-csrf': csrf() } };
  if (body !== undefined) { opts.headers['content-type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await fetch(path, opts);
  const text = await res.text();
  let data; try { data = text ? JSON.parse(text) : {}; } catch (e) { data = { raw: text }; }
  return { status: res.status, data };
}
async function refresh() {
  const a = await api('GET', '/api/state');
  if (a.status === 401) { location.href = '/login'; return; }
  state = a.data;
  const b = await api('GET', '/api/cores');
  cores = (b.data && b.data.cores) || [];
  renderOverview(); renderPorts(); renderInbounds(); renderUsers(); renderCores();
}
function h(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function gb(n) { return n ? (n / 1073741824).toFixed(1) + ' GB' : '-'; }
function renderOverview() {
  document.getElementById('overview').innerHTML =
    '<div class="muted">配置：' + h(state.configPath) + '　模式：' + h(state.nginxMode) + '　公网 IP：' + h(state.publicIp || '未设置') + '</div>' +
    '<div style="margin-top:8px">入站 ' + state.inbounds.length + ' 个，用户 ' + state.users.length + ' 个，订阅 ' + state.subscriptions.length + ' 个</div>' +
    (state.errors.length ? '<div class="err">' + state.errors.map(e => '- ' + h(e)).join('<br>') + '</div>' : '<div class="ok">校验通过</div>') +
    (state.warnings.length ? '<div class="warn">' + state.warnings.map(e => '- ' + h(e)).join('<br>') + '</div>' : '');
}
function renderPorts() {
  document.getElementById('ports').innerHTML = '<table><thead><tr><th>端口</th><th>组件</th><th>监听</th></tr></thead><tbody>' +
    state.ports.map(p => '<tr><td>' + h(p.port) + '</td><td>' + h(p.label) + '</td><td>' + h(p.listen || '0.0.0.0') + '</td></tr>').join('') + '</tbody></table>';
}
function renderInbounds() {
  const t = document.getElementById('inboundTable');
  t.innerHTML = state.inbounds.length
    ? '<table><thead><tr><th>内核</th><th>tag</th><th>协议</th><th>监听</th><th>网络</th><th>安全</th><th>操作</th></tr></thead><tbody>' +
      state.inbounds.map(ib => '<tr><td>' + h(ib.kind) + '</td><td><code>' + h(ib.tag) + '</code></td><td>' + h(ib.protocol) + '</td><td>' + h(ib.listen + ':' + ib.port) + '</td><td>' + h(ib.network) + '</td><td>' + h(ib.security) + '</td>' +
      '<td><button class="ghost" onclick="openClients(\'' + h(ib.kind) + '\',\'' + h(ib.tag) + '\')">客户端</button> <button class="ghost" onclick="editInbound(\'' + h(ib.kind) + '\',\'' + h(ib.tag) + '\')">编辑</button> <button class="ghost danger" onclick="delInbound(\'' + h(ib.kind) + '\',\'' + h(ib.tag) + '\')">删除</button></td></tr>').join('') + '</tbody></table>'
    : '<div class="muted">还没有入站</div>';
  renderInboundForm(editingInbound);
}
function renderInboundForm(editable) {
  const ib = editable || { kind: 'xray', tag: '', protocol: 'vless', listen: '127.0.0.1', port: 10443, network: 'tcp', security: 'none', sni: '', wsPath: '/ws', reality: {} };
  const r = ib.reality || {};
  document.getElementById('inboundFormTitle').textContent = editable ? ('编辑入站：' + editable.tag) : '新增入站';
  document.getElementById('inboundForm').innerHTML =
    '<div class="row">' +
    '<label>内核<select id="i_kind"><option value="xray"' + (ib.kind === 'xray' ? ' selected' : '') + '>xray</option><option value="singbox"' + (ib.kind === 'singbox' ? ' selected' : '') + '>singbox</option></select></label>' +
    '<label>tag<input id="i_tag" value="' + h(ib.tag) + '"></label>' +
    '<label>协议<select id="i_proto">' + ['vless','vmess','trojan'].map(p => '<option' + (ib.protocol === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></label>' +
    '<label>监听<input id="i_listen" value="' + h(ib.listen) + '"></label>' +
    '<label>端口<input id="i_port" type="number" value="' + h(ib.port) + '"></label>' +
    '<label>网络<select id="i_net">' + ['tcp','ws','grpc','h2'].map(p => '<option' + (ib.network === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></label>' +
    '<label>安全<select id="i_sec">' + ['none','tls','reality'].map(p => '<option' + (ib.security === p ? ' selected' : '') + '>' + p + '</option>').join('') + '</select></label>' +
    '<label>SNI<input id="i_sni" value="' + h(ib.sni || '') + '"></label>' +
    '<label>WS 路径<input id="i_ws" value="' + h(ib.wsPath || '/ws') + '"></label>' +
    '</div>' +
    '<div class="row" style="margin-top:10px">' +
    '<label>Reality dest<input id="i_rdest" value="' + h(r.dest || '') + '" placeholder="www.bing.com:443"></label>' +
    '<label>Reality serverNames<input id="i_rnames" value="' + h((r.serverNames || []).join(',')) + '" placeholder="www.bing.com"></label>' +
    '<label>Reality privateKey<input id="i_rkey" value="' + h(r.privateKey || '') + '"></label>' +
    '<label>Reality shortIds<input id="i_rsid" value="' + h((r.shortIds || []).join(',')) + '" placeholder="0123456789abcdef"></label>' +
    '</div>' +
    '<div class="row" style="margin-top:12px"><button class="act" id="saveInbound">' + (editable ? '保存修改' : '创建入站') + '</button>' +
    (editable ? '<button class="ghost" onclick="cancelInbound()">取消</button>' : '') + '<span id="inboundMsg" class="muted"></span></div>';
  document.getElementById('saveInbound').onclick = saveInbound;
}
function collectInbound() {
  return {
    kind: document.getElementById('i_kind').value,
    tag: document.getElementById('i_tag').value.trim(),
    protocol: document.getElementById('i_proto').value,
    listen: document.getElementById('i_listen').value.trim(),
    port: Number(document.getElementById('i_port').value),
    network: document.getElementById('i_net').value,
    security: document.getElementById('i_sec').value,
    sni: document.getElementById('i_sni').value.trim(),
    wsPath: document.getElementById('i_ws').value.trim(),
    realityDest: document.getElementById('i_rdest').value.trim(),
    realityServerNames: document.getElementById('i_rnames').value.trim(),
    realityPrivateKey: document.getElementById('i_rkey').value.trim(),
    realityShortIds: document.getElementById('i_rsid').value.trim(),
  };
}
async function saveInbound() {
  const body = collectInbound();
  const msg = document.getElementById('inboundMsg');
  if (!body.tag) { msg.textContent = 'tag 必填'; msg.className = 'err'; return; }
  const r = editingInbound
    ? await api('PUT', '/api/inbounds/' + editingInbound.kind + '/' + encodeURIComponent(editingInbound.tag), body)
    : await api('POST', '/api/inbounds', body);
  if (r.status === 200) { editingInbound = null; msg.textContent = '已保存'; await refresh(); }
  else { msg.textContent = (r.data.error || '失败') + (r.data.errors ? ': ' + r.data.errors.join('; ') : ''); msg.className = 'err'; }
}
function editInbound(kind, tag) {
  const found = state.inbounds.find(i => i.kind === kind && i.tag === tag);
  if (!found) return;
  editingInbound = Object.assign({}, found, { reality: found.reality || {} });
  renderInbounds();
}
function cancelInbound() { editingInbound = null; renderInbounds(); }
async function delInbound(kind, tag) {
  if (!confirm('删除入站 ' + tag + ' ?')) return;
  const r = await api('DELETE', '/api/inbounds/' + kind + '/' + encodeURIComponent(tag));
  if (r.status === 200) { editingInbound = null; await refresh(); } else alert(r.data.error || '删除失败');
}
function renderCores() {
  document.getElementById('coreTable').innerHTML = '<table><thead><tr><th>内核</th><th>单元</th><th>生成配置</th><th>运行状态</th><th>操作</th></tr></thead><tbody>' +
    cores.map(c => '<tr><td>' + h(c.kind) + '</td><td><code>' + h(c.unit) + '</code></td>' +
    '<td><span class="pill ' + (c.enabled ? 'on' : 'off') + '">' + (c.enabled ? 'enabled' : 'disabled') + '</span></td>' +
    '<td><span class="pill ' + (c.active ? 'on' : 'off') + '">' + (c.active ? 'active' : 'inactive') + '</span> <span class="muted">' + h(c.probe || '') + '</span></td>' +
    '<td><button class="ghost" onclick="coreAct(\'' + c.kind + '\',\'start\')">start</button> ' +
    '<button class="ghost" onclick="coreAct(\'' + c.kind + '\',\'stop\')">stop</button> ' +
    '<button class="ghost" onclick="coreAct(\'' + c.kind + '\',\'restart\')">restart</button> ' +
    (c.kind !== 'nginx' ? '<button class="ghost" onclick="toggleCore(\'' + c.kind + '\',' + (!c.enabled) + ')">' + (c.enabled ? '停用配置' : '启用配置') + '</button>' : '') +
    '</td></tr>').join('') + '</tbody></table>';
}
async function coreAct(kind, action) {
  const r = await api('POST', '/api/cores/' + kind + '/' + action);
  if (r.status !== 200) alert((r.data.error || 'failed') + '\n' + (r.data.output || ''));
  await refresh();
}
async function toggleCore(kind, enabled) {
  const r = await api('PUT', '/api/cores/' + kind, { enabled: enabled });
  if (r.status !== 200) alert(r.data.error || 'failed');
  await refresh();
}
function renderUsers() {
  const t = document.getElementById('userTable');
  t.innerHTML = state.users.length
    ? '<table><thead><tr><th>用户</th><th>状态</th><th>到期</th><th>用量/配额</th><th>入站</th><th>操作</th></tr></thead><tbody>' +
      state.users.map(u => '<tr><td>' + h(u.name) + '</td><td>' + h(u.status) + '</td><td>' + h(u.expireAt || '-') + '</td><td>' + gb(u.usedBytes) + ' / ' + gb(u.dataLimitBytes) + '</td><td>' + h(u.inbounds.join(', ') || '-') + '</td>' +
      '<td><button class="ghost" onclick="editUser(\'' + h(u.name) + '\')">编辑</button> <button class="ghost danger" onclick="delUser(\'' + h(u.name) + '\')">删除</button></td></tr>').join('') + '</tbody></table>'
    : '<div class="muted">还没有用户</div>';
  renderUserForm(editingUser);
}
function renderUserForm(user) {
  const u = user || { name: '', inbounds: [], expireAt: '', dataLimitBytes: 0, enabled: true, note: '' };
  document.getElementById('userFormTitle').textContent = user ? ('编辑用户：' + user.name) : '新增用户';
  document.getElementById('userForm').innerHTML =
    '<div class="row">' +
    '<label>用户名<input id="f_name" value="' + h(u.name) + '"></label>' +
    '<label>到期日期<input id="f_expire" type="date" value="' + h(u.expireAt) + '"></label>' +
    '<label>流量配额 (GB)<input id="f_quota" type="number" min="0" step="1" value="' + (u.dataLimitBytes ? (u.dataLimitBytes / 1073741824).toFixed(0) : 0) + '"></label>' +
    '<label>备注<input id="f_note" value="' + h(u.note || '') + '"></label>' +
    '<label><span>启用</span><input id="f_enabled" type="checkbox" ' + (u.enabled !== false ? 'checked' : '') + '></label>' +
    '</div>' +
    '<div class="muted" style="margin:10px 0 6px">入站</div><div id="f_inbounds" class="row">' +
    state.inbounds.map(ib => '<label style="flex-direction:row;gap:6px;align-items:center"><input type="checkbox" value="' + h(ib.tag) + '" ' + (u.inbounds.includes(ib.tag) ? 'checked' : '') + '>' + h(ib.tag) + ' <span class="muted">(' + h(ib.kind) + ')</span></label>').join('') +
    '</div>' +
    '<div class="row" style="margin-top:12px"><button class="act" id="saveUser">' + (user ? '保存修改' : '创建用户') + '</button>' +
    (user ? '<button class="ghost" onclick="cancelEdit()">取消</button>' : '') + '<span id="userMsg" class="muted"></span></div>';
  document.getElementById('saveUser').onclick = saveUser;
}
function collectUser() {
  const tags = Array.from(document.querySelectorAll('#f_inbounds input:checked')).map(i => i.value);
  const gbValue = Number(document.getElementById('f_quota').value || 0);
  return {
    name: document.getElementById('f_name').value.trim(),
    inbounds: tags,
    expireAt: document.getElementById('f_expire').value ? document.getElementById('f_expire').value + 'T00:00:00Z' : '',
    dataLimitBytes: gbValue > 0 ? Math.round(gbValue * 1073741824) : 0,
    enabled: document.getElementById('f_enabled').checked,
    note: document.getElementById('f_note').value.trim(),
  };
}
async function saveUser() {
  const body = collectUser();
  const msg = document.getElementById('userMsg');
  if (!body.name) { msg.textContent = '用户名必填'; msg.className = 'err'; return; }
  const r = editingUser ? await api('PUT', '/api/users/' + encodeURIComponent(editingUser.name), body) : await api('POST', '/api/users', body);
  if (r.status === 200) { editingUser = null; msg.textContent = '已保存'; await refresh(); }
  else { msg.textContent = (r.data.error || '失败') + (r.data.errors ? ': ' + r.data.errors.join('; ') : ''); msg.className = 'err'; }
}
function editUser(name) { editingUser = state.users.find(u => u.name === name); renderUsers(); }
function cancelEdit() { editingUser = null; renderUsers(); }
async function delUser(name) {
  if (!confirm('删除用户 ' + name + ' ?')) return;
  const r = await api('DELETE', '/api/users/' + encodeURIComponent(name));
  if (r.status === 200) { editingUser = null; await refresh(); } else alert(r.data.error || '删除失败');
}
async function loadConfig() {
  const r = await api('GET', '/api/config');
  document.getElementById('configText').value = r.data.json || '';
}
document.getElementById('saveConfig').onclick = async () => {
  const msg = document.getElementById('configMsg');
  const r = await api('PUT', '/api/config', { json: document.getElementById('configText').value });
  if (r.status === 200) { msg.textContent = '已保存，备份在 config.json.bak-*'; msg.className = 'ok'; await refresh(); }
  else { msg.textContent = (r.data.error || '保存失败') + (r.data.errors ? ': ' + r.data.errors.join('; ') : ''); msg.className = 'err'; }
};
document.getElementById('reloadConfig').onclick = () => loadConfig();
document.querySelectorAll('[data-action]').forEach(btn => {
  btn.onclick = async () => {
    const action = btn.dataset.action;
    const body = action === 'apply' ? { confirm: document.getElementById('applyConfirm').value } : {};
    const out = document.getElementById('actionOut');
    out.textContent = 'running ' + action + ' ...';
    const r = await api('POST', '/api/actions/' + action, body);
    out.textContent = (r.status === 200 ? (r.data.output || JSON.stringify(r.data, null, 2)) : ('error: ' + (r.data.error || r.status)));
    await refresh();
  };
});
document.querySelectorAll('nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    document.querySelectorAll('main section').forEach(s => s.classList.remove('on'));
    document.getElementById('tab-' + btn.dataset.tab).classList.add('on');
    if (btn.dataset.tab === 'config') loadConfig();
    if (btn.dataset.tab === 'stats') loadStats();
    if (btn.dataset.tab === 'logs') loadLogs();
    if (btn.dataset.tab === 'settings') loadSettings();
  };
});
async function openClients(kind, tag) {
  currentInbound = { kind: kind, tag: tag };
  const r = await api('GET', '/api/inbounds/' + kind + '/' + encodeURIComponent(tag) + '/clients');
  const list = (r.data && r.data.clients) || [];
  document.getElementById('clientsTitle').textContent = '客户端：' + kind + ' / ' + tag;
  const rows = list.length
    ? '<table><thead><tr><th>名称</th><th>凭据</th><th>操作</th></tr></thead><tbody>' +
      list.map(c => '<tr><td>' + h(c.name) + '</td><td><code>' + h(c.credential) + '</code></td><td><button class="ghost danger" data-client="' + h(c.name) + '">删除</button></td></tr>').join('') + '</tbody></table>'
    : '<div class="muted">该入站还没有显式客户端（凭据可由 server.secret 派生）</div>';
  document.getElementById('clientsPanel').innerHTML = rows +
    '<div class="row" style="margin-top:10px"><label>名称<input id="c_name"></label>' +
    '<label>凭据（留空自动派生）<input id="c_cred"></label>' +
    '<button class="act" id="c_add">添加客户端</button><span id="c_msg" class="muted"></span></div>';
  document.getElementById('c_add').onclick = function () { addClient(kind, tag); };
  document.querySelectorAll('#clientsPanel [data-client]').forEach(function (btn) {
    btn.onclick = function () { delClient(kind, tag, btn.dataset.client); };
  });
}

async function addClient(kind, tag) {
  const name = document.getElementById('c_name').value.trim();
  const credential = document.getElementById('c_cred').value.trim();
  const msg = document.getElementById('c_msg');
  if (!name) { msg.textContent = '名称必填'; msg.className = 'err'; return; }
  const r = await api('POST', '/api/inbounds/' + kind + '/' + encodeURIComponent(tag) + '/clients', { name: name, credential: credential });
  if (r.status === 200) { await refresh(); await openClients(kind, tag); }
  else { msg.textContent = r.data.error || '失败'; msg.className = 'err'; }
}

async function delClient(kind, tag, name) {
  if (!confirm('删除客户端 ' + name + ' ?')) return;
  const r = await api('DELETE', '/api/inbounds/' + kind + '/' + encodeURIComponent(tag) + '/clients/' + encodeURIComponent(name));
  if (r.status === 200) { await refresh(); await openClients(kind, tag); } else alert(r.data.error || '删除失败');
}

async function loadStats() {
  const r = await api('GET', '/api/stats');
  const rows = (r.data && r.data.rows) || [];
  document.getElementById('statsTable').innerHTML = rows.length
    ? '<table><thead><tr><th>用户</th><th>上行</th><th>下行</th><th>合计</th></tr></thead><tbody>' +
      rows.map(x => '<tr><td>' + h(x.name) + '</td><td>' + gb(x.upload) + '</td><td>' + gb(x.download) + '</td><td>' + gb(x.upload + x.download) + '</td></tr>').join('') + '</tbody></table>'
    : '<div class="muted">没有采集到数据（内核未运行或统计接口不可用）</div>';
  const errors = (r.data && r.data.errors) || [];
  document.getElementById('statsErrors').innerHTML = errors.length ? errors.map(e => '<div class="warn">' + h(e) + '</div>').join('') : '<span class="ok">(none)</span>';
}

document.getElementById('syncStats').onclick = async function () {
  const r = await api('POST', '/api/stats/sync');
  const msg = document.getElementById('statsMsg');
  if (r.status === 200) { msg.textContent = '已同步 ' + r.data.changed + ' 个用户'; msg.className = 'ok'; await refresh(); await loadStats(); }
  else { msg.textContent = r.data.error || '失败'; msg.className = 'err'; }
};

async function loadLogs() {
  const unit = document.getElementById('logUnit').value;
  const lines = document.getElementById('logLines').value;
  const r = await api('GET', '/api/logs?unit=' + encodeURIComponent(unit) + '&lines=' + encodeURIComponent(lines));
  document.getElementById('logOut').textContent = r.status === 200 ? (r.data.output || '(empty)') : ('error: ' + (r.data.error || r.status));
}

document.getElementById('loadLogsBtn').onclick = loadLogs;

async function loadSettings() {
  const r = await api('GET', '/api/settings');
  const s = r.data || {};
  const server = s.server || {};
  const ports = s.ports || {};
  const panels = s.panels || {};
  const xui = panels.xui || {};
  const sui = panels.sui || {};
  const mode = (s.nginx && s.nginx.mode) || 'http';
  document.getElementById('settingsForm').innerHTML =
    '<div class="row">' +
    '<label>公网 IP<input id="s_ip" value="' + h(server.publicIp) + '"></label>' +
    '<label>邮箱<input id="s_email" value="' + h(server.email) + '"></label>' +
    '<label>网站域名<input id="s_web" value="' + h((server.domains || {}).web) + '"></label>' +
    '<label>证书文件<input id="s_cert" value="' + h((server.cert || {}).certFile) + '"></label>' +
    '<label>私钥文件<input id="s_key" value="' + h((server.cert || {}).keyFile) + '"></label>' +
    '</div><div class="row" style="margin-top:10px">' +
    '<label>HTTP 端口<input id="s_http" type="number" value="' + h(ports.http || 80) + '"></label>' +
    '<label>HTTPS 端口<input id="s_https" type="number" value="' + h(ports.https || 443) + '"></label>' +
    '<label>nginx 内部 TLS<input id="s_tls" type="number" value="' + h(ports.nginxInternalTls || 8443) + '"></label>' +
    '<label>nginx 模式<select id="s_mode"><option value="stream"' + (mode === 'stream' ? ' selected' : '') + '>stream</option><option value="http"' + (mode === 'http' ? ' selected' : '') + '>http</option></select></label>' +
    '</div><div class="row" style="margin-top:10px">' +
    '<label>x-ui 域名<input id="s_xui" value="' + h(xui.domain) + '"></label>' +
    '<label>x-ui 端口<input id="s_xuip" type="number" value="' + h(xui.port || 54321) + '"></label>' +
    '<label>s-ui 域名<input id="s_sui" value="' + h(sui.domain) + '"></label>' +
    '<label>s-ui 端口<input id="s_suip" type="number" value="' + h(sui.port || 2095) + '"></label>' +
    '</div><div class="row" style="margin-top:12px"><button class="act" id="saveSettings">保存设置</button><span id="settingsMsg" class="muted"></span></div>';
  document.getElementById('saveSettings').onclick = saveSettings;
}

async function saveSettings() {
  const body = {
    publicIp: document.getElementById('s_ip').value,
    email: document.getElementById('s_email').value,
    webDomain: document.getElementById('s_web').value,
    certFile: document.getElementById('s_cert').value,
    keyFile: document.getElementById('s_key').value,
    http: Number(document.getElementById('s_http').value),
    https: Number(document.getElementById('s_https').value),
    nginxInternalTls: Number(document.getElementById('s_tls').value),
    nginxMode: document.getElementById('s_mode').value,
    xui: { domain: document.getElementById('s_xui').value, port: Number(document.getElementById('s_xuip').value) },
    sui: { domain: document.getElementById('s_sui').value, port: Number(document.getElementById('s_suip').value) },
  };
  const msg = document.getElementById('settingsMsg');
  const r = await api('PUT', '/api/settings', body);
  if (r.status === 200) { msg.textContent = '已保存'; msg.className = 'ok'; await refresh(); }
  else { msg.textContent = (r.data.error || '失败') + (r.data.errors ? ': ' + r.data.errors.join('; ') : ''); msg.className = 'err'; }
}

refresh();
</script></body></html>
